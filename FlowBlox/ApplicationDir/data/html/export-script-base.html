<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowBlox model script</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #172033; background: #f4f8fc; }
    body { max-width: 980px; margin: 0 auto; padding: 40px 24px; }
    h1 { margin-bottom: 8px; font-size: 30px; }
    p { line-height: 1.55; color: #46566d; }
    .notice { border-left: 4px solid #2384e8; padding: 10px 16px; background: #eaf4fc; border-radius: 8px; }
    .special-hint { display: none; align-items: flex-start; gap: 10px; margin-top: 16px; padding: 12px 16px; border: 1px solid #ead28b; border-radius: 8px; background: #fff8d8; color: #66531b; line-height: 1.55; }
    .special-hint svg { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px; fill: #c28b00; }
    .code-card { position: relative; margin-top: 24px; overflow: hidden; border: 1px solid #cad8e8; border-radius: 16px; background: #17233a; box-shadow: 0 14px 38px rgba(34, 72, 112, .16); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 14px; color: #c8d8ea; background: #21314e; }
    .actions { display: flex; gap: 8px; }
    button { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid #5d83ae; border-radius: 9px; color: white; background: #247fdb; cursor: pointer; font-weight: 600; }
    button:hover { background: #176fc4; }
    button:disabled { cursor: default; opacity: .65; }
    button svg { width: 17px; height: 17px; fill: currentColor; }
    pre { margin: 0; padding: 22px; overflow: auto; color: #e8f0fa; font: 13px/1.55 Consolas, "Cascadia Code", monospace; tab-size: 4; }
    code { white-space: pre; }
    .path { font-family: Consolas, monospace; color: #185d98; }
    #script-fallback { display: none; width: 100%; height: 620px; border: 0; background: white; }
  </style>
</head>
<body>
  <h1 id="heading">FlowBlox model script</h1>
  <p id="notice" class="notice">Loading script description…</p>
  <p id="description"></p>
  <div id="special-hint" class="special-hint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6v-1H9v1Zm3-20a7 7 0 0 0-4 12.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.26A7 7 0 0 0 12 1Zm2.7 11.31-.7.41V17h-4v-4.28l-.7-.41A5 5 0 1 1 14.7 12.31Z"/></svg>
    <span id="special-hint-text"></span>
  </div>

  <div class="code-card">
    <div class="toolbar">
      <span id="filename">model-script.py</span>
      <div class="actions">
        <button id="download" type="button" aria-label="Download Python script">Download .py</button>
        <button id="copy-path" type="button" aria-label="Copy Python script file path">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H8a2 2 0 0 1-2-2V8h2v11h11v2Zm-4-4H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2ZM5 5v10h10V5H5Z"/></svg>
          <span id="copy-path-label">Copy script path</span>
        </button>
        <button id="copy" type="button" aria-label="Copy Python script">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H8a2 2 0 0 1-2-2V8h2v11h11v2Zm-4-4H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2ZM5 5v10h10V5H5Z"/></svg>
          <span id="copy-label">Copy</span>
        </button>
      </div>
    </div>
    <pre id="script-container"><code id="script">Loading Python script…</code></pre>
    <iframe id="script-fallback" title="Python script source"></iframe>
  </div>

  <script>
    let page = { filename: 'model-script.py', scriptUrl: '', specialHint: '' };
    let scriptText = '';
    const heading = document.getElementById('heading');
    const notice = document.getElementById('notice');
    const description = document.getElementById('description');
    const specialHint = document.getElementById('special-hint');
    const specialHintText = document.getElementById('special-hint-text');
    const filename = document.getElementById('filename');
    const script = document.getElementById('script');
    const scriptContainer = document.getElementById('script-container');
    const scriptFallback = document.getElementById('script-fallback');
    const copyButton = document.getElementById('copy');
    const copyLabel = document.getElementById('copy-label');
    const copyPathLabel = document.getElementById('copy-path-label');

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const copied = document.execCommand('copy');
      area.remove();
      if (!copied) throw new Error('Copy command was rejected.');
    }

    function getScriptFilePath() {
      const url = new URL(page.scriptUrl, window.location.href);
      if (url.protocol !== 'file:') return url.href;

      let path = decodeURIComponent(url.pathname);
      if (/^\/[A-Za-z]:\//.test(path)) path = path.substring(1);
      return path.replaceAll('/', '\\');
    }

    async function loadScript() {
      scriptText = '';
      script.textContent = 'Loading Python script…';
      scriptContainer.style.display = 'block';
      scriptFallback.style.display = 'none';
      copyButton.style.display = 'inline-flex';

      try {
        const response = await fetch(page.scriptUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        scriptText = await response.text();
        script.textContent = scriptText;
      } catch {
        // Browsers commonly block fetch() between local file:// resources. A direct
        // iframe still displays the published ../python file without duplicating it.
        scriptContainer.style.display = 'none';
        scriptFallback.src = page.scriptUrl;
        scriptFallback.style.display = 'block';
        copyButton.style.display = 'none';
      }
    }

    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.data?.type !== 'flowblox-export-script') return;
      page = event.data.page;
      document.title = page.documentTitle || page.title;
      heading.textContent = page.title;
      notice.innerHTML = page.notice;
      description.innerHTML = page.description;
      specialHintText.innerHTML = page.specialHint || '';
      specialHint.style.display = page.specialHint ? 'flex' : 'none';
      filename.textContent = page.filename;
      document.getElementById('copy-path').title = getScriptFilePath();
      loadScript();
    });

    copyButton.addEventListener('click', async () => {
      if (!scriptText) return;
      try {
        await copyText(scriptText);
        copyLabel.textContent = 'Copied';
        setTimeout(() => copyLabel.textContent = 'Copy', 1600);
      } catch {
        copyLabel.textContent = 'Select and copy';
      }
    });

    document.getElementById('copy-path').addEventListener('click', async () => {
      try {
        await copyText(getScriptFilePath());
        copyPathLabel.textContent = 'Path copied';
        setTimeout(() => copyPathLabel.textContent = 'Copy script path', 1600);
      } catch {
        window.prompt('Copy script path:', getScriptFilePath());
      }
    });

    document.getElementById('download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = page.scriptUrl;
      link.download = page.filename;
      link.click();
    });

    window.parent.postMessage({ type: 'flowblox-export-script-ready' }, '*');
  </script>
</body>
</html>
