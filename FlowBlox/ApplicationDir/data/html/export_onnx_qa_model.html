<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowBlox extractive QA ONNX export script</title>
  <style>html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; } body { overflow: hidden; }</style>
</head>
<body>
  <iframe id="page" src="export-script-base.html" title="FlowBlox model script"></iframe>
  <script>
    const page = {
      documentTitle: 'FlowBlox extractive QA ONNX export script',
      title: 'Export an extractive QA model to ONNX',
      notice: '<strong>Before you start:</strong> checkpoints and their ONNX exports may require several GB. Ensure that Python and enough free disk space are available.',
      description: 'The default is multilingual mDeBERTa-v3 SQuAD2. Use <span class="path">--model-id</span> for another QA checkpoint, <span class="path">--model-root-directory &lt;folder&gt;</span> for a custom model root, or <span class="path">--output-directory &lt;folder&gt;</span> for an exact model folder. By default, models are stored below <span class="path">%USERPROFILE%\\.flowblox\\onnx\\qa</span>. A complete existing model is reused immediately.',
      specialHint: '<strong>Tip:</strong> Add this script under <strong>Tools &gt; Manage input files</strong>, set <strong>Command</strong> to <span class="path">python &quot;$InputFile::Path&quot; --model-root-directory &quot;$Options::AI.Onnx.QA.ModelRootDirectory&quot;</span>, and enable <strong>Execute before runtime start</strong>. Without <span class="path">--model-id</span>, the script prepares the default multilingual mDeBERTa-v3 SQuAD2 model.<br><br><strong>Supported and tested model IDs:</strong><br><span class="path">timpal0l/mdeberta-v3-base-squad2</span> (default)<br><span class="path">deepset/deberta-v3-base-squad2</span><br><span class="path">deepset/xlm-roberta-base-squad2</span><br><span class="path">deepset/gelectra-base-germanquad</span><br><br>Each runtime checks the shared model root and returns immediately when the model is complete.<br><br><strong>Provider note:</strong> The exported model must be compatible with the ONNX Runtime provider selected in FlowBlox. Selecting a different provider does not convert the model.',
      filename: 'export_onnx_qa_model.py',
      scriptUrl: '../python/export_onnx_qa_model.py'
    };
    const frame = document.getElementById('page');
    const send = () => frame.contentWindow.postMessage({ type: 'flowblox-export-script', page }, '*');
    frame.addEventListener('load', send);
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.data?.type === 'flowblox-export-script-ready') send();
    });
  </script>
</body>
</html>
