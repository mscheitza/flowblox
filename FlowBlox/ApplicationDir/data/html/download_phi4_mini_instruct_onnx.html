<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowBlox Phi-4 Mini Instruct ONNX GenAI download script</title>
  <style>html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; } body { overflow: hidden; }</style>
</head>
<body>
  <iframe id="page" src="export-script-base.html" title="FlowBlox model script"></iframe>
  <script>
    const page = {
      documentTitle: 'FlowBlox Phi-4 Mini Instruct ONNX GenAI download script',
      title: 'Download Phi-4 Mini Instruct for ONNX Runtime GenAI',
      notice: '<strong>Before you start:</strong> the CPU INT4 model is about 4.9 GB. Ensure that Python and enough free disk space are available.',
      description: 'Run the published script with Python. Use <span class="path">--model-root-directory &lt;folder&gt;</span> for a custom model root or <span class="path">--output-directory &lt;folder&gt;</span> for an exact model folder. By default, the model is stored below <span class="path">%USERPROFILE%\\.flowblox\\onnx\\genai</span>. The selected CPU variant is stored in <span class="path">Phi-4-mini-instruct-onnx</span>, and a complete existing model is reused immediately.',
      specialHint: '<strong>Tip:</strong> Add this script under <strong>Tools &gt; Manage input files</strong>, set <strong>Command</strong> to <span class="path">python &quot;$InputFile::Path&quot; --model-root-directory &quot;$Options::AI.Onnx.GenAI.ModelRootDirectory&quot;</span>, and enable <strong>Execute before runtime start</strong>. Each runtime then checks the shared model root and returns immediately when the model is complete.<br><br><strong>Provider note:</strong> This demo downloads the CPU INT4 model. When using CUDA, DirectML, or OpenVINO, download a model variant compatible with that provider and adjust the script or model folder accordingly. Selecting a different runtime provider does not convert the model.',
      filename: 'download_phi4_mini_instruct_onnx.py',
      scriptUrl: '../python/download_phi4_mini_instruct_onnx.py'
    };
    const frame = document.getElementById('page');
    const send = () => frame.contentWindow.postMessage({ type: 'flowblox-export-script', page }, '*');
    frame.addEventListener('load', send);
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.data?.type === 'flowblox-export-script-ready') send();
    });
  </script>
</body>
</html>
